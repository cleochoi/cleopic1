<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>클레오픽 CleoPIc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 한 장짜리 시험지 — 이름표, 문항 탭, 문항 카드(듣기 → 녹음 → 확인), 하단 제출 패널 */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#18242a; --muted:#5b6a6f; --line:#d3dbda;
  --accent:#1f5f6b; --accent-ink:#ffffff; --soft:#e1ebe9;
  --rec:#d23f38; --ok:#2e7a4d;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#11191c;--surface:#19252a;--ink:#e5eeed;--muted:#97a7aa;--line:#2b3a3f;
    --accent:#72bcc7;--accent-ink:#0c1a1d;--soft:#1f323a;--rec:#ff6a61;--ok:#6fce95;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 40px)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--display);font-size:2.4rem;line-height:1.1;margin:0;font-weight:400}
.brand small{font-family:var(--mono);font-size:.8rem;color:var(--accent);letter-spacing:.12em;margin-left:8px;vertical-align:middle}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.warnbar{background:var(--rec);color:#fff;border-radius:10px;padding:10px 14px;font-size:.9rem}
.name{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.name label{font-weight:700;white-space:nowrap;font-size:.9rem}
.name input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;outline:none}
.name input[readonly]{color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:6px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 2px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;min-width:0}
.day b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.day span{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 4px}
.day[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-selected="true"] span{color:var(--accent-ink)}
.day.sent span{color:var(--ok);font-weight:700}.day[aria-selected="true"].sent span{color:var(--accent-ink)}
.day:disabled{opacity:.5;cursor:not-allowed}
.daytitle{font-family:var(--display);font-size:1.35rem;margin:0}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:.85rem;color:var(--muted);text-decoration:underline;cursor:pointer;align-self:flex-start}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 0;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tab b{font-family:var(--mono);font-size:.95rem}
.tab span{font-size:.72rem;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab.done{background:var(--soft)}
.tab.done span{color:var(--ok);font-weight:700}
.tab:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:.75rem;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
.qnum{font-family:var(--mono);color:var(--muted);font-size:.85rem;white-space:nowrap}
.step{display:flex;flex-direction:column;gap:10px}
.step h3{margin:0;font-size:.8rem;letter-spacing:.1em;color:var(--muted);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn.rec{background:var(--rec);color:#fff;border-color:var(--rec)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.script{border-left:3px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0}
.recbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.recdot{display:inline-flex;align-items:center;gap:6px;color:var(--rec);font-weight:700;font-size:.9rem}
.recdot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--rec);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.meter i{display:block;height:100%;width:0;background:var(--rec);transition:width .08s linear}
.transcript{min-height:80px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;
  white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.transcript.wait{color:var(--muted)}
audio{width:100%}
.err{font-size:.9rem;color:var(--rec);margin:0}
.eval{background:var(--soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.eval p{margin:0}.eval ul{margin:2px 0 6px;padding-left:20px}
.evlabel{font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}.evlabel span{font-weight:400;margin-left:4px}
.evtop{font-weight:700;margin:4px 0 4px!important}
.lv{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 8px;margin-right:8px;font-family:var(--mono);font-size:.85rem}
.evh{font-size:.8rem;font-weight:700;color:var(--accent);margin-top:6px!important}
.bt{margin:2px 0 6px!important}.bt s{color:var(--muted)}
.closed{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;text-align:center}
.closed h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 0 6px}.closed p{margin:0;color:var(--muted)}
.submit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.submit h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0}
.progress{font-family:var(--mono);font-size:.9rem;color:var(--muted)}
.linkbox{font-family:var(--mono);font-size:.85rem;background:var(--soft);border-radius:10px;padding:10px 14px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);z-index:5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">클레오픽<small>CleoPIc</small></h1>
    <p class="sub" id="subText">롤플레이 녹음 숙제. 하루에 한 세트(3문항)씩 녹음해서 제출하세요.</p>
  </header>

  <div class="warnbar" id="configWarn" hidden>선생님 설정이 아직 안 됐어요. index.html의 API_URL에 웹 앱 주소를 넣어주세요.</div>

  <nav class="days" id="days"></nav>

  <div class="name">
    <label for="studentName">이름</label>
    <input id="studentName" autocomplete="name" placeholder="녹음 전에 이름을 입력하세요">
  </div>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <section class="card" id="card"></section>

  <section class="submit">
    <h2>숙제 제출</h2>
    <div class="progress" id="progress"></div>
    <div class="row"><button class="btn primary" id="submitBtn">제출하고 링크 받기</button></div>
    <div id="linkArea" hidden>
      <div class="linkbox" id="linkBox"></div>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="copyLinkBtn">링크 복사</button></div>
      <p class="hint" style="margin-top:8px">복사한 링크를 카카오톡으로 선생님께 보내면 제출 끝!</p>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== 선생님 설정 ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbwKznD-iw20x4tDb2LKAv-cgoJEvTWt1bGat-k70oQodISMQLXJveL4Gcpe_FLt7w4j/exec";   // 예: https://script.google.com/macros/s/AKfy.../exec

/* 요일별 세트: 하루에 한 세트(11·12·13번)를 녹음해서 제출해요.
   주제를 바꾸려면 title과 qs 안의 영어 질문만 바꾸면 돼요. (질문 안에 큰따옴표 " 는 쓰지 마세요) */
const DAYS = [
  {day:"월", title:"호텔 예약", qs:[
    "You are planning a trip and want to book a hotel. Call the hotel and ask three or four questions about the room, location, and services.",
    "The hotel tells you that your reservation cannot be found when you arrive. Talk to the front desk, explain the situation, and work out a solution.",
    "Tell me about a time when something went wrong during a trip. What was the problem, and what did you do?"
  ]},
  {day:"화", title:"헬스장 등록", qs:[
    "You want to sign up for a new gym. Call the gym and ask three or four questions about its membership, facilities, and operating hours.",
    "You just found out that the gym is closed during the hours you usually work out. Call the gym, explain the problem, and suggest a solution.",
    "Have you ever had a problem with a gym, sports club, or class? What happened, and how did you deal with it?"
  ]},
  {day:"수", title:"공연 티켓", qs:[
    "Your friend is going to a concert. Call your friend and ask three or four questions about the concert, such as the date, venue, and ticket price.",
    "You can no longer attend because something unexpected came up. Call your friend, explain the situation, and suggest what to do with your ticket.",
    "Tell me about a time when you had to cancel or change plans for an event. What happened?"
  ]},
  {day:"목", title:"스마트폰 구매", qs:[
    "You want to buy a new smartphone. Call an electronics store and ask three or four questions about the models, prices, and available features.",
    "After buying the phone, you discover that it has a problem. Call the store, explain the issue, and ask them to help you resolve it.",
    "Have you ever bought something that didn't work properly? Describe what happened and how you handled it."
  ]},
  {day:"금", title:"친구에게 물건 빌리기", qs:[
    "You want to borrow a camera from your friend for a weekend trip. Call your friend and ask three or four questions about the camera and when you can pick it up.",
    "You accidentally damage the camera. Call your friend, explain what happened, and suggest how you will make it right.",
    "Have you ever borrowed or lent something that got lost or damaged? Tell me what happened."
  ]}
];
const ROLE_TYPES = [{no:11, type:"질문하기"}, {no:12, type:"문제해결"}, {no:13, type:"관련경험"}];
const START_DATE = "2026-11-21";  // 숙제 시작일 (이날부터 사용 가능)
const VALID_DAYS = 10;            // 시작일 포함 며칠 동안 열리는지
const MAX_REPLAYS = 2;       // 첫 듣기 이후 다시 듣기 횟수
const MAX_SECONDS = 180;     // 녹음 최대 3분
const TARGET_RATE = 16000;   // 저장 음질 (16kHz 모노 WAV)
/* ====================== */

const openAt = new Date(START_DATE + "T00:00:00+09:00");
const closeAt = new Date(openAt.getTime() + VALID_DAYS * 86400000);
const lastDay = new Date(closeAt.getTime() - 86400000);
const kstDay = d => { const k = new Date(d.getTime() + 9 * 3600000); return (k.getUTCMonth() + 1) + "월 " + k.getUTCDate() + "일"; };   // 한국 날짜로 표시
const lastDayText = kstDay(lastDay);
const expired = Date.now() >= closeAt.getTime();
const notYet = Date.now() < openAt.getTime();
const configured = /^https:\/\/script\.google\.com\//.test(API_URL);
const newSid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()) + Date.now()).replace(/[^a-zA-Z0-9]/g, "").slice(0, 32);

// 요일마다 따로: 제출ID, 문항 상태, 제출 링크
// phase: idle | recording | uploading | ready | error
const dayData = DAYS.map(D => ({
  sid: newSid(), link: "",
  questions: D.qs.map((text, i) => ({no:ROLE_TYPES[i].no, type:ROLE_TYPES[i].type, label:D.day + " · " + D.title + " · " + ROLE_TYPES[i].no + "번 " + ROLE_TYPES[i].type, text})),
  state: D.qs.map(() => ({plays:0, scriptShown:false, phase:"idle", wav:null, url:null, transcript:"", evalr:null, warn:"", seconds:0, done:false}))
}));
const todayIdx = (() => { const w = new Date(Date.now() + 9 * 3600000).getUTCDay(); return w >= 1 && w <= 5 ? w - 1 : 0; })();
let dayIdx = Math.min(DAYS.length - 1, Math.max(0, (parseInt(new URLSearchParams(location.search).get("day"), 10) || todayIdx + 1) - 1));
let sid = dayData[dayIdx].sid, state = dayData[dayIdx].state, QUESTIONS = dayData[dayIdx].questions;
let cur = 0, speaking = false, recIndex = -1, submitted = false;
let stream = null, recorder = null, chunks = [], tick = null, startAt = 0, micLost = false;

const $ = id => document.getElementById(id);
const busy = () => state.some(s => s.phase === "recording" || s.phase === "uploading");

/* ---------- 미국식 영어 음성 ---------- */
let usVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  const prefer = ["Google US English","Samantha","Microsoft Aria","Microsoft Jenny","Alex","Aaron"];
  usVoice = prefer.map(n => vs.find(v => v.name.includes(n))).find(Boolean)
         || vs.find(v => (v.lang || "").replace("_","-") === "en-US") || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text){
  if (!("speechSynthesis" in window)){ toast("이 브라우저는 질문 음성을 지원하지 않아요."); return false; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if (usVoice) u.voice = usVoice; u.rate = 0.92;
  u.onend = u.onerror = () => { speaking = false; render(); };
  speaking = true;
  speechSynthesis.speak(u);
  return true;
}

function onListen(){
  const s = state[cur];
  if (speaking || busy()) return;
  if (s.plays > MAX_REPLAYS){ s.scriptShown = true; render(); return; }   // 세 번째 다시 듣기 → 스크립트 공개
  if (speak(QUESTIONS[cur].text)){ s.plays++; render(); }
}

/* ---------- 녹음 ----------
   휴대폰 기본 녹음기(MediaRecorder)를 그대로 씀. 마이크 설정은 폰 기본값(에코·잡음 제거, 자동 볼륨 켜짐)을 건드리지 않음.
   → 녹음 중에는 다른 소리 처리(AudioContext)를 전혀 돌리지 않아서 마이크가 끊기지 않게 함.
   녹음이 끝난 뒤에만 16kHz WAV로 바꿔서 서버로 보냄. */
async function startRec(){
  if (busy()) return;
  if (!configured){ toast("선생님 설정이 필요해요."); return; }
  const name = $("studentName").value.trim();
  if (!name){ toast("녹음 전에 이름을 입력해 주세요."); $("studentName").focus(); return; }
  if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("이 브라우저는 녹음을 지원하지 않아요. 크롬이나 사파리로 열어주세요. (카카오톡 안에서 열었다면 '다른 브라우저로 열기')"); return;
  }
  if ("speechSynthesis" in window) speechSynthesis.cancel();   // 질문 음성이 마이크를 붙잡지 않게
  speaking = false;

  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  } catch(e){
    toast("마이크를 쓸 수 없어요. 마이크 권한을 허용해 주세요. (" + (e && e.name || "오류") + ")"); return;
  }

  const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"]
    .find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  try {
    recorder = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
  } catch(_){
    try { recorder = new MediaRecorder(stream); }
    catch(e){ stream.getTracks().forEach(t => t.stop()); stream = null; toast("녹음을 시작하지 못했어요. (" + (e && e.name || "오류") + ")"); return; }
  }
  chunks = []; micLost = false;
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = finishRec;
  recorder.onerror = () => { micLost = true; stopRec(); };
  const track = stream.getAudioTracks()[0];
  if (track) track.onended = () => { micLost = true; stopRec(); };   // 다른 앱이 마이크를 가져간 경우

  const s = state[cur];
  if (s.url) URL.revokeObjectURL(s.url);
  Object.assign(s, {phase:"recording", wav:null, url:null, transcript:"", evalr:null, warn:"", seconds:0, done:false});
  recIndex = cur;
  $("studentName").readOnly = true;                    // 같은 학생 폴더로 저장되도록 이름 고정
  recorder.start(1000);
  startAt = Date.now();
  tick = setInterval(() => {
    const sec = Math.floor((Date.now() - startAt) / 1000);
    state[recIndex].seconds = sec;
    const el = $("timer"); if (el) el.textContent = fmt(sec);
    if (sec >= MAX_SECONDS) stopRec();
  }, 250);
  render();
}

/* 폰 기본 녹음기로 녹음 (웹 마이크가 안 될 때) */
let nativeInput = null;
function startNative(){
  if (busy()) return;
  if (!configured){ toast("선생님 설정이 필요해요."); return; }
  const name = $("studentName").value.trim();
  if (!name){ toast("녹음 전에 이름을 입력해 주세요."); $("studentName").focus(); return; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  speaking = false;
  if (!nativeInput){
    nativeInput = document.createElement("input");
    nativeInput.type = "file"; nativeInput.accept = "audio/*"; nativeInput.setAttribute("capture", "");
    nativeInput.style.display = "none"; document.body.appendChild(nativeInput);
    nativeInput.onchange = onNativeFile;
  }
  nativeInput.dataset.q = cur; nativeInput.dataset.day = dayIdx;
  nativeInput.value = ""; nativeInput.click();
}
async function onNativeFile(){
  const f = nativeInput.files && nativeInput.files[0];
  if (!f) return;
  if (Number(nativeInput.dataset.day) !== dayIdx){ toast("요일이 바뀌어서 취소됐어요. 다시 녹음해 주세요."); return; }
  const i = Number(nativeInput.dataset.q), s = state[i];
  if (s.url) URL.revokeObjectURL(s.url);
  Object.assign(s, {phase:"uploading", wav:null, url:null, transcript:"", evalr:null, warn:"", seconds:0, done:false});
  recIndex = i; $("studentName").readOnly = true; render();
  let samples;
  try { samples = await decodeTo16k(f); }
  catch(e){ s.phase = "idle"; render(); toast("이 녹음 파일은 열 수 없어요. 다른 녹음 앱으로 다시 해 주세요."); return; }
  if (samples.length < TARGET_RATE * 0.5){ s.phase = "idle"; render(); toast("녹음된 소리가 없어요."); return; }
  if (samples.length > TARGET_RATE * MAX_SECONDS) samples = samples.subarray(0, TARGET_RATE * MAX_SECONDS);
  s.seconds = Math.round(samples.length / TARGET_RATE);
  s.wav = encodeWav(normalize(samples), TARGET_RATE);
  s.url = URL.createObjectURL(s.wav);
  upload(i);
}

function stopRec(){
  const s = state[recIndex];
  if (!s || s.phase !== "recording") return;
  clearInterval(tick);
  s.phase = "uploading"; render();
  try { if (recorder && recorder.state !== "inactive") recorder.stop(); else finishRec(); }
  catch(_){ finishRec(); }
}

async function finishRec(){
  const i = recIndex, s = state[i];
  if (!s || s.phase !== "uploading" || s.wav) return;
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  const type = (recorder && recorder.mimeType) || (chunks[0] && chunks[0].type) || "audio/webm";
  const blob = new Blob(chunks, {type}); chunks = [];
  let samples;
  try { samples = await decodeTo16k(blob); }
  catch(e){
    s.phase = "idle"; render();
    toast("녹음을 처리하지 못했어요. 다시 녹음해 주세요. (" + (e && e.name || "변환 오류") + ")"); return;
  }
  if (samples.length < TARGET_RATE * 0.5){
    s.phase = "idle"; render();
    toast(micLost ? "녹음 중에 마이크가 끊겼어요. 통화·음악·음성비서 앱을 끄고, 블루투스를 껐다 켠 뒤 다시 녹음해 주세요." : "녹음된 소리가 없어요. 다시 녹음해 주세요.");
    return;
  }
  if (micLost) toast("녹음 중에 마이크가 끊겨서 거기까지만 저장됐어요.");
  else if (peakOf(samples) < 0.002) toast("소리가 아주 작게 녹음됐어요. 폰을 입 가까이 대고 다시 녹음해 보세요.");
  s.wav = encodeWav(normalize(samples), TARGET_RATE);
  s.url = URL.createObjectURL(s.wav);
  upload(i);
}

// 녹음 파일 → 16kHz 모노 (녹음이 끝난 뒤에만 실행)
async function decodeTo16k(blob){
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  let decoded;
  try {
    const buf = await blob.arrayBuffer();
    decoded = await new Promise((ok, fail) => { const p = ctx.decodeAudioData(buf, ok, fail); if (p && p.then) p.then(ok, fail); });
  } finally { try { ctx.close(); } catch(_){} }
  let mix = decoded.getChannelData(0);
  if (decoded.numberOfChannels > 1){
    const b = decoded.getChannelData(1), m = new Float32Array(mix.length);
    for (let k = 0; k < m.length; k++) m[k] = (mix[k] + b[k]) / 2;
    mix = m;
  }
  return downsample(mix, decoded.sampleRate, TARGET_RATE);
}

function peakOf(x){ let p = 0; for (let i = 0; i < x.length; i++) p = Math.max(p, Math.abs(x[i])); return p; }
function normalize(x){
  const peak = peakOf(x);
  if (peak < 0.0005 || peak >= 0.85) return x;
  const g = Math.min(10, 0.85 / peak), y = new Float32Array(x.length);
  for (let i = 0; i < x.length; i++) y[i] = x[i] * g;
  return y;
}

function downsample(buf, from, to){
  if (to >= from) return buf;
  const ratio = from / to, out = new Float32Array(Math.floor(buf.length / ratio));
  for (let i = 0; i < out.length; i++){
    const a = Math.floor(i * ratio), b = Math.min(buf.length, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = a; j < b; j++) sum += buf[j];
    out[i] = sum / Math.max(1, b - a);
  }
  return out;
}
function encodeWav(samples, rate){
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,"data"); v.setUint32(40, samples.length * 2, true);
  for (let i = 0, o = 44; i < samples.length; i++, o += 2){
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
  }
  return new Blob([buf], {type:"audio/wav"});
}

/* ---------- 서버로 보내기 → 스크립트 받기 ---------- */
function blobToBase64(blob){
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1]);
    r.onerror = fail;
    r.readAsDataURL(blob);
  });
}
async function api(payload){
  const res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "서버 오류");
  return j;
}

async function upload(i){
  const s = state[i];
  s.phase = "uploading"; s.warn = ""; render();
  try {
    const j = await api({
      action:"answer", sid, name:$("studentName").value.trim(), q:i + 1,
      qType:QUESTIONS[i].label || QUESTIONS[i].type, qText:QUESTIONS[i].text, seconds:s.seconds,
      data: await blobToBase64(s.wav)
    });
    s.transcript = j.transcript || "";
    s.evalr = j.evaluation || null;
    s.warn = j.warn || "";
    s.phase = "ready";
  } catch(e){
    s.phase = "error";
    s.warn = "전송에 실패했어요. 인터넷 연결을 확인하고 ‘다시 보내기’를 눌러주세요.";
  }
  render();
}

function reRecord(){ state[cur].done = false; startRec(); }
function confirmAnswer(){
  const s = state[cur];
  if (s.phase !== "ready") return;
  s.done = true;
  const next = state.findIndex(x => !x.done);
  if (next !== -1) cur = next;
  render();
  toast(next === -1 ? DAYS[dayIdx].day + "요일 3문항 완료! 아래에서 제출하세요." : "담았어요. Q" + QUESTIONS[next].no + "로 넘어갑니다.");
}

/* ---------- 화면 ---------- */
function fmt(sec){ return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function evalBox(e){
  if (!e) return "";
  const li = a => (a || []).map(x => `<li>${esc(x)}</li>`).join("");
  let h = `<div class="eval"><div class="evlabel">Cleo's TIP <span>AI 평가 · 참고용</span></div>`;
  h += `<p class="evtop">${e.level ? `<span class="lv">${esc(e.level)}</span>` : ""}${esc(e.summary || "")}</p>`;
  if (e.good && e.good.length) h += `<p class="evh">① 잘한 점</p><ul>${li(e.good)}</ul>`;
  if (e.fix && e.fix.length) h += `<p class="evh">② 보완할 점</p><ul>${li(e.fix)}</ul>`;
  if (e.pron && e.pron.length) h += `<p class="evh">③ 발음 주의</p><ul>${e.pron.map(p => `<li><b lang="en">${esc(p.word || "")}</b> ${esc(p.tip || "")}</li>`).join("")}</ul>`;
  const fx = e.corrections || e.better || [];
  if (fx.length) h += `<p class="evh">④ 틀린 문장 고치기</p>` + fx.map(b =>
    `<p class="bt">${b.from ? `<s lang="en">${esc(b.from)}</s><br>` : ""}<span lang="en">→ ${esc(b.to)}</span>${b.why ? `<br><small>${esc(b.why)}</small>` : ""}</p>`).join("");
  return h + `</div>`;
}

function renderDays(){
  const nav = $("days"); nav.innerHTML = "";
  DAYS.forEach((D, i) => {
    const b = document.createElement("button");
    const sent = !!dayData[i].link;
    b.className = "day" + (sent ? " sent" : "");
    b.setAttribute("role", "tab"); b.setAttribute("aria-selected", i === dayIdx);
    b.disabled = busy() && i !== dayIdx;
    b.innerHTML = `<b>${D.day}</b><span>${sent ? "제출완료" : esc(D.title)}</span>`;
    b.onclick = () => selectDay(i);
    nav.appendChild(b);
  });
}

function selectDay(i){
  if (i === dayIdx || busy()) return;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  speaking = false;
  dayIdx = i; sid = dayData[i].sid; state = dayData[i].state; QUESTIONS = dayData[i].questions;
  cur = Math.max(0, state.findIndex(x => !x.done)); 
  const btn = $("submitBtn"); delete btn.dataset.sure;
  render();
}

function renderTabs(){
  const nav = $("tabs"); nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (state[i].done ? " done" : "");
    b.setAttribute("role", "tab"); b.setAttribute("aria-selected", i === cur);
    b.disabled = busy();
    b.innerHTML = `<b>Q${q.no}</b><span>${state[i].done ? "완료" : q.type}</span>`;
    b.onclick = () => { if (!busy()){ if ("speechSynthesis" in window) speechSynthesis.cancel(); speaking = false; cur = i; render(); } };
    nav.appendChild(b);
  });
}

function renderCard(){
  const q = QUESTIONS[cur], s = state[cur], card = $("card");
  const left = Math.max(0, MAX_REPLAYS - Math.max(0, s.plays - 1));
  let listenLabel, listenHint;
  if (s.plays === 0){ listenLabel = "▶ 질문 듣기"; listenHint = "실제 시험처럼 질문은 소리로만 나와요."; }
  else if (s.plays <= MAX_REPLAYS){ listenLabel = `↻ 다시 듣기 (${left}회 남음)`; listenHint = `다시 듣기는 ${MAX_REPLAYS}번까지 가능해요.`; }
  else { listenLabel = s.scriptShown ? "질문 스크립트 표시됨" : "질문 스크립트 보기"; listenHint = "다시 듣기를 모두 사용했어요. 질문을 글로 확인하세요."; }

  let recArea;
  if (s.phase === "recording"){
    recArea = `<button class="btn rec" id="stopBtn">■ 녹음 끝내기</button><span class="timer" id="timer">${fmt(s.seconds)}</span><span class="recdot">녹음 중</span>`;
  } else if (s.phase === "idle"){
    recArea = `<button class="btn rec" id="recBtn" ${busy() ? "disabled" : ""}>● 녹음 시작</button><span class="hint">최대 ${MAX_SECONDS / 60}분</span>`;
  } else {
    recArea = `<span class="timer">${fmt(s.seconds)}</span><span class="hint">녹음 완료</span>`;
  }

  let tBox;
  if (s.phase === "uploading") tBox = `<div class="transcript wait">스크립트와 Cleo's TIP을 만들고 있어요… (10~40초)</div>`;
  else if (s.transcript) tBox = `<div class="transcript" lang="en">${esc(s.transcript)}</div>`;
  else tBox = `<div class="transcript wait">녹음을 끝내면 답변이 영어 스크립트로 여기에 나타나요.</div>`;

  const showReview = s.wav && (s.phase === "ready" || s.phase === "error" || s.phase === "uploading");

  card.innerHTML = `
    <p class="daytitle">${DAYS[dayIdx].day}요일 · ${esc(DAYS[dayIdx].title)}</p>
    <div class="qhead"><span class="chip">${q.no}번 ${esc(q.type)}</span><span class="qnum">QUESTION ${q.no}</span></div>

    <div class="step">
      <h3>1. 질문 듣기 · 미국식 발음</h3>
      <div class="row"><button class="btn primary" id="listenBtn" ${speaking || busy() || s.scriptShown ? "disabled" : ""}>${speaking ? "재생 중…" : listenLabel}</button></div>
      <p class="hint">${listenHint}</p>
      ${s.scriptShown ? `<div class="script" lang="en">${esc(q.text)}</div>` : ""}
    </div>

    <div class="step">
      <h3>2. 영어로 답변 녹음</h3>
      <div class="recbar">${recArea}</div>
      ${s.phase === "idle" ? `<p class="hint">조용한 곳에서, 폰을 입에서 한 뼘 거리에 두고 녹음하세요.</p>
      <button class="linkbtn" id="nativeBtn" ${busy() ? "disabled" : ""}>녹음이 계속 끊기면 → 폰 녹음기로 녹음하기</button>` : ""}
    </div>

    ${showReview ? `
    <div class="step">
      <h3>3. 들어보고 결정하기</h3>
      <audio controls src="${s.url}"></audio>
      ${tBox}
      ${evalBox(s.evalr)}
      ${s.warn ? `<p class="err">${esc(s.warn)}</p>` : ""}
      <div class="row">
        <button class="btn" id="copyTBtn" ${s.transcript ? "" : "disabled"}>스크립트 복사</button>
        ${s.phase === "error" ? `<button class="btn" id="retryBtn">다시 보내기</button>` : ""}
      </div>
      <div class="row">
        <button class="btn" id="reBtn" ${s.phase === "uploading" ? "disabled" : ""}>다시 녹음</button>
        <button class="btn primary" id="okBtn" ${s.phase !== "ready" || s.done ? "disabled" : ""}>${s.done ? "✓ 제출 목록에 담김" : "이 답변으로 제출"}</button>
      </div>
    </div>` : ""}
  `;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("nativeBtn", startNative);
  on("listenBtn", onListen); on("recBtn", startRec); on("stopBtn", stopRec);
  on("reBtn", reRecord); on("okBtn", confirmAnswer); on("retryBtn", () => upload(cur));
  on("copyTBtn", () => copyText(state[cur].transcript, "스크립트를 복사했어요."));
}

function renderSubmit(){
  const n = state.filter(s => s.done).length;
  $("progress").textContent = `제출 준비 ${n} / ${QUESTIONS.length}문항`;
  const btn = $("submitBtn"), link = dayData[dayIdx].link;
  btn.disabled = n === 0 || busy();
  if (btn.textContent !== "제출 중…") btn.textContent = link ? "다시 제출하기" : (btn.dataset.sure ? `${n}문항만 제출하기` : `${DAYS[dayIdx].day}요일 숙제 제출하고 링크 받기`);
  $("linkBox").textContent = link;
  $("linkArea").hidden = !link;
}

function render(){ renderDays(); renderTabs(); renderCard(); renderSubmit(); }

/* ---------- 제출 ---------- */
async function submitAll(){
  const qs = state.map((s, i) => s.done ? i + 1 : 0).filter(Boolean);
  if (!qs.length) return;
  if (qs.length < QUESTIONS.length && !$("submitBtn").dataset.sure){
    $("submitBtn").dataset.sure = "1";
    $("submitBtn").textContent = `${qs.length}문항만 제출하기`;
    toast(`아직 ${QUESTIONS.length - qs.length}문항이 남았어요. 그래도 제출하려면 한 번 더 누르세요.`);
    return;
  }
  const btn = $("submitBtn"), d = dayIdx;
  btn.disabled = true; btn.textContent = "제출 중…";
  try {
    const j = await api({action:"finalize", sid:dayData[d].sid, name:$("studentName").value.trim(), qs});
    dayData[d].link = j.link;
    toast(DAYS[d].day + "요일 제출 완료! 링크를 복사해서 보내주세요.");
  } catch(e){
    toast("제출에 실패했어요. 잠시 후 다시 눌러주세요.");
  }
  btn.textContent = "";
  render();
}

async function copyText(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(_){
    const ta = document.createElement("textarea"); ta.value = text; ta.readOnly = true;
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(okMsg); } catch(__){ toast("복사가 안 되면 링크를 길게 눌러 선택해 주세요."); }
    ta.remove();
  }
}

let toastTimer;
function toast(m){ const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3000); }

$("submitBtn").onclick = submitAll;
$("copyLinkBtn").onclick = () => copyText(`[클레오픽 숙제] ${$("studentName").value.trim()} · ${DAYS[dayIdx].day}요일 ${DAYS[dayIdx].title}\n${$("linkBox").textContent}`, "링크를 복사했어요. 카톡에 붙여넣어 보내세요.");
$("configWarn").hidden = configured;
try { $("studentName").value = localStorage.getItem("cleopic_name") || ""; } catch(_){}
$("studentName").addEventListener("input", e => { try { localStorage.setItem("cleopic_name", e.target.value); } catch(_){} });
window.addEventListener("beforeunload", e => { if (dayData.some(D => !D.link && D.state.some(s => s.wav))){ e.preventDefault(); e.returnValue = ""; } });
function hideMain(){
  $("configWarn").hidden = true;
  [$("days"), document.querySelector(".name"), $("tabs"), $("card"), document.querySelector(".submit")].forEach(el => el.style.display = "none");
}
if (expired || notYet){
  hideMain();
  $("subText").textContent = "";
  const box = document.createElement("section"); box.className = "closed";
  box.innerHTML = expired
    ? `<h2>사용기한이 끝났어요</h2><p>이 숙제는 ${lastDayText}까지였어요. 선생님께 문의해 주세요.</p>`
    : `<h2>아직 열리지 않았어요</h2><p>${kstDay(openAt)}부터 할 수 있어요.</p>`;
  document.querySelector(".wrap").appendChild(box);
} else {
  $("subText").textContent = "하루에 한 세트(11·12·13번)씩 녹음해서 제출하세요 · " + lastDayText + "까지";
  $("tabs").style.setProperty("--cols", 3);
  render();
}
</script>
